name: Linux Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            linux/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('linux/src-tauri/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: linux
        run: npm ci

      - name: Build AppImage (Tauri)
        working-directory: linux
        run: |
          cargo install tauri-cli --version "^2.0.0"
          cd src-tauri && cargo tauri build --bundles appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: harbor-linux-appimage
          path: linux/src-tauri/target/release/bundle/appimage/*.AppImage