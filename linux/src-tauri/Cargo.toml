[package]
name = "harbor-app"
version = "1.0.3"
description = "Harbor — your digital safe harbor. A desktop presence app for couples."
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
zbus = { version = "4", features = ["blocking"] }
libc = "0.2"
# For .desktop file parsing and icon theme lookup
dirs = "5.0"
# WebKitGTK media permission: auto-grant the microphone so getUserMedia isn't
# denied by the default permission handler (the "call nunca funcionou" on Linux).
webkit2gtk = "2.0"

[features]
# Used by the Tauri CLI for production builds (custom protocol).
custom-protocol = ["tauri/custom-protocol"]
