```yaml
# Harbor CI: one product version (VERSION.txt) across desktop Linux,
# desktop Windows and Android. Tags look like v2.1.0 and must match VERSION.txt.
#
# Release assets (names are a contract: the in-app updaters pick them):
#   harbor-linux-x86_64.tar.gz   (+ .sha256)
#   harbor-windows-x86_64.zip    (+ .sha256)
#   harbor-android-arm64-debug.apk (+ .sha256)  testing channel, see below
#
# The Android build is still lapidary work: it compiles, installs and runs,
# but rides the debug key and the Tailnet-only path, so releases label it
# as testing and CI keeps it as a regular (watched, non-gating for desktop
# releases) job.

name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  # Keep the same Qt version on every target.
  QT_VERSION_DESKTOP: "6.8.3"
  QT_VERSION_ANDROID: "6.8.3"

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Single product version everywhere
        run: |
          set -euo pipefail

          VERSION="$(tr -d ' \t\r\n' < VERSION.txt)"

          test -n "$VERSION"

          grep -q 'file(READ "${CMAKE_CURRENT_SOURCE_DIR}/VERSION.txt"' CMakeLists.txt
          grep -q 'file(READ "${CMAKE_CURRENT_SOURCE_DIR}/../VERSION.txt"' Harbor-Mobile/CMakeLists.txt

          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"

          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          grep -q "android:versionCode=\"$CODE\"" Harbor-Mobile/android/AndroidManifest.xml
          grep -q "android:versionName=\"$VERSION\"" Harbor-Mobile/android/AndroidManifest.xml

          echo "version $VERSION (code $CODE) is consistent"

  linux:
    needs: version-check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libopus-dev \
            libvpx-dev \
            libfontconfig1 \
            libfreetype6 \
            libxkbcommon0 \
            libdbus-1-3 \
            libgl1 \
            libegl1

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_DESKTOP }}
          host: linux
          target: desktop
          cache: false
          cache-key-prefix: install-qt-linux

      - name: Verify Qt kit completeness
        run: |
          set -euo pipefail

          test -x "$QT_ROOT_DIR/bin/qt-cmake" \
            || { echo "incomplete Qt kit: qt-cmake missing"; exit 1; }

          test -x "$QT_ROOT_DIR/bin/qmake" \
            || test -x "$QT_ROOT_DIR/bin/qmake6" \
            || { echo "incomplete Qt kit: qmake missing"; exit 1; }

          test -x "$QT_ROOT_DIR/bin/moc" \
            || test -x "$QT_ROOT_DIR/libexec/moc" \
            || { echo "incomplete Qt kit: moc missing"; exit 1; }

          echo "Qt root: $QT_ROOT_DIR"
          du -sh "$QT_ROOT_DIR"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: media/go.sum

      - name: Configure, build, test
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

          cmake --build build --parallel
          cmake --build build --target all_qmllint
          ctest --test-dir build --output-on-failure

      - name: Package release tarball
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          VERSION="$(tr -d ' \t\r\n' < VERSION.txt)"
          STAGE="dist/harbor-linux-x86_64"

          mkdir -p "$STAGE"

          cp \
            build/harbor \
            build/cargo-target/release/harbor-core \
            "$STAGE/" 2>/dev/null \
            || cp \
              build/harbor \
              build/cargo-target/debug/harbor-core \
              "$STAGE/"

          cp build/media/harbor-media "$STAGE/"

          echo "$VERSION" > "$STAGE/version.txt"

          tar -czf \
            harbor-linux-x86_64.tar.gz \
            -C dist \
            harbor-linux-x86_64

          sha256sum harbor-linux-x86_64.tar.gz \
            | awk '{print $1}' \
            > harbor-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            harbor-linux-x86_64.tar.gz
            harbor-linux-x86_64.tar.gz.sha256


  windows:
    needs: version-check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Qt (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_DESKTOP }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: false

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: media/go.sum

      - name: MinGW + Opus for the media worker CGO build
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config mingw-w64-x86_64-opus

      - name: Configure, build, test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Ninja: MSBuild cannot create the Qt resource paths with "..".
          # CC points Go/CGO at MinGW while Rust's cc crate keeps MSVC cl.
          # Slashes are normalized: msys2-location arrives with backslashes,
          # which MinGW gcc misreads inside -I/-L flags.

          $msys = '${{ steps.msys2.outputs.msys2-location }}' -replace '\\','/'

          $env:PATH = $env:PATH + ";$msys/mingw64/bin"

          $env:CC = "$msys/mingw64/bin/x86_64-w64-mingw32-gcc.exe"
          $env:CC_x86_64_pc_windows_msvc = 'cl.exe'

          # Pin pkg-config to msys2's own binary and point cgo
          # directly at the opus headers/import library.
          $env:PKG_CONFIG = "$msys/mingw64/bin/pkg-config.exe"
          $env:PKG_CONFIG_PATH = "$msys/mingw64/lib/pkgconfig"

          $env:CGO_CFLAGS = "-I$msys/mingw64/include"
          $env:CGO_LDFLAGS = "-L$msys/mingw64/lib -lopus"

          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d ' \t\r\n' < VERSION.txt)"

          mkdir -p dist/harbor-windows-x86_64

          cp \
            build/Release/harbor.exe \
            build/Release/harbor-core.exe \
            build/Release/harbor-media.exe \
            dist/harbor-windows-x86_64/

          echo "$VERSION" > dist/harbor-windows-x86_64/version.txt

          (
            cd dist
            7z a ../harbor-windows-x86_64.zip harbor-windows-x86_64
          )

          sha256sum harbor-windows-x86_64.zip \
            | awk '{print $1}' \
            > harbor-windows-x86_64.zip.sha256

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            harbor-windows-x86_64.zip
            harbor-windows-x86_64.zip.sha256


  android:
    # Testing channel: debug key, Tailnet path, emulator-proven.
    needs: version-check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          mkdir -p "$HOME/Android"

          ln -sfn \
            "$ANDROID_SDK_ROOT" \
            "$HOME/Android/Sdk"

          "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

      # Qt Android requires a matching desktop Qt host kit.
      # install-qt-action@v4 automatically invokes aqtinstall with
      # --autodesktop for Android/Qt 6, so both kits are installed
      # by the same action invocation.
      - name: Qt for Android ARM64
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_ANDROID }}
          host: linux
          target: android
          arch: android_arm64_v8a
          dir: /home/runner/Qt
          cache: false
          cache-key-prefix: install-qt-android
          aqtversion: "==3.3.*"

      - name: Verify Android Qt installation
        run: |
          set -euo pipefail

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          KIT="$HOME/Qt/${{ env.QT_VERSION_ANDROID }}/android_arm64_v8a"

          echo "Qt installation tree:"
          find "$HOME/Qt/${{ env.QT_VERSION_ANDROID }}" \
            -maxdepth 3 \
            -type d \
            | sort

          echo
          echo "Android Qt kit: $KIT"

          test -d "$KIT" \
            || {
              echo "ERROR: Android Qt kit directory does not exist:"
              echo "$KIT"
              exit 1
            }

          test -f "$KIT/lib/cmake/Qt6Core/Qt6CoreConfig.cmake" \
            || {
              echo "ERROR: Qt6CoreConfig.cmake missing"
              find "$KIT" -maxdepth 5 -iname '*Qt6Core*' -print
              exit 1
            }

          test -f "$KIT/lib/cmake/Qt6Core/Qt6CoreTargets.cmake" \
            || {
              echo "ERROR: Qt6CoreTargets.cmake missing"
              exit 1
            }

          test -x "$KIT/bin/qt-cmake" \
            || {
              echo "ERROR: Android qt-cmake missing"
              exit 1
            }

          echo
          echo "Qt6Core:"
          ls -la "$KIT/lib/cmake/Qt6Core/"

          echo
          echo "Qt Android kit size:"
          du -sh "$KIT"

      - name: Verify Qt desktop host kit
        run: |
          set -euo pipefail

          HOST_KIT="$HOME/Qt/${{ env.QT_VERSION_ANDROID }}/gcc_64"

          echo "Expected Qt host kit: $HOST_KIT"

          test -d "$HOST_KIT" \
            || {
              echo "ERROR: Qt desktop host kit missing"
              find "$HOME/Qt/${{ env.QT_VERSION_ANDROID }}" \
                -maxdepth 2 \
                -type d \
                | sort
              exit 1
            }

          test -x "$HOST_KIT/bin/qmake" \
            || test -x "$HOST_KIT/bin/qmake6" \
            || {
              echo "ERROR: host qmake missing"
              exit 1
            }

          test -x "$HOST_KIT/bin/moc" \
            || test -x "$HOST_KIT/libexec/moc" \
            || {
              echo "ERROR: host moc missing"
              exit 1
            }

          echo "Qt host kit OK"

      - name: Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: media/go.sum

      - name: Build debug APK
        env:
          HARBOR_QT_VERSION: ${{ env.QT_VERSION_ANDROID }}
        run: |
          set -euo pipefail

          ./Harbor-Mobile/build-android.sh arm64

      - name: Rename + checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          APK="$(find Harbor-Mobile/build-arm64 \
            -path '*outputs/apk/debug/*.apk' \
            -type f \
            | head -1)"

          test -n "$APK" \
            || {
              echo "ERROR: debug APK not found"
              find Harbor-Mobile/build-arm64 -type f -name '*.apk' -print
              exit 1
            }

          cp "$APK" harbor-android-arm64-debug.apk

          sha256sum harbor-android-arm64-debug.apk \
            | awk '{print $1}' \
            > harbor-android-arm64-debug.apk.sha256

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: |
            harbor-android-arm64-debug.apk
            harbor-android-arm64-debug.apk.sha256


  release:
    needs: [linux, windows, android]

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            harbor-linux-x86_64.tar.gz
            harbor-linux-x86_64.tar.gz.sha256
            harbor-windows-x86_64.zip
            harbor-windows-x86_64.zip.sha256
            harbor-android-arm64-debug.apk
            harbor-android-arm64-debug.apk.sha256

          generate_release_notes: true

          body: |
            Harbor ${{ github.ref_name }} — updates install themselves on every version (mandatory once discovered; offline never bricks the app).

            - **PC Linux** (`harbor-linux-x86_64.tar.gz`): ready for daily use.
            - **PC Windows** (`harbor-windows-x86_64.zip`): ready for daily use.
            - **Android** (`harbor-android-arm64-debug.apk`): 🚧 still testing — debug-signed, Tailnet path, emulator-proven.
```



```yaml
- name: Qt for Android ARM64
  uses: jurplel/install-qt-action@v4
  with:
    version: ${{ env.QT_VERSION_ANDROID }}
    host: linux
    target: android
    arch: android_arm64_v8a
    dir: /home/runner/Qt
    cache: false
    aqtversion: "==3.3.*"
```

No `v4`, a action já detecta que Android precisa do Qt desktop correspondente e passa `--autodesktop` ao `aqtinstall`; portanto não precisamos mais daquele `qt-desktop-kit` artificial.


```text
Qt6CoreConfig missing
```

o CI vai imprimir a árvore de instalação e mostrar exatamente onde o `Qt6Core` foi parar.

O arquivo que você mandou confirma que atualmente o erro acontece exatamente na verificação de `Qt6CoreConfig.cmake` do kit Android.

**Importante:** eu não manteria mais o `qt-desktop-kit` do seu arquivo antigo. Ele adicionava complexidade e era justamente a tentativa de contornar um comportamento que o `install-qt-action@v4` já resolve oficialmente.

Se você substituir o `.github/workflows/build.yml` por esse conteúdo, o próximo run já vai testar a instalação Android de uma forma bem mais limpa.
