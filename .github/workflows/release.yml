# Harbor — release + signed mandatory auto-update artifacts (Fase 2).
#
# Triggers:
#   - `git push origin v*`    → cut a public GitHub Release with the signed NSIS
#     installer, its .sig sidecar, and the `latest.json` updater manifest.
#   - `workflow_dispatch`      → retrigger the same build for a given tag by hand
#     (e.g. to re-publish a corrupt/missing release asset without re-tagging).
#
# The Windows job publishes the NSIS installer and creates the initial updater
# manifest. The Linux job then adds the signed AppImage and merges the
# `linux-x86_64` platform entry into that same manifest.
#
# Signing: the private half of the keypair generated with `tauri signer generate`
# (`.tauri/harbor.key`, local + gitignored) is pasted into GitHub Secrets as
# TAURI_SIGNING_PRIVATE_KEY (+ ..._PASSWORD). The action signs the .exe with it
# during `cargo tauri build`; the public half is embedded in tauri.conf.json
# (`plugins.updater.pubkey`) so the installed app validates the .sig before
# installing. NO keys are committed to this repo or hardcoded in the YAML.
#
# Versioning: `tauri.conf.json` is the updater's source of truth, but the same
# version must exist in `Cargo.toml` and `client/package.json` — the consistency
# step below fails the build if any of the three diverge, so a release always
# carries one real version. Bump = edit all three + tag `vX.Y.Z`.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish"
        required: true
        default: "v1.0.2"

# `tauri-action` creates the release + uploads assets, so it needs write access
# to repo contents. `workflow_dispatch` still respects this; restrict the
# permission to contents only (least privilege).
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    # Run only on the tag itself — guards against workflow_dispatch from a
    # non-tagged ref accidentally producing an unversioned release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Version consistency guard — Windows and Linux must publish the same
      # release version. The updater compares the app version against
      # latest.json, so a mismatch produces a silently-wrong update gate.
      - name: Fail if the version diverges across the three sources
        shell: bash
        run: |
          set -euo pipefail
          # tauri.conf.json is JSONC (comments), Cargo.toml is TOML — neither is
          # safe to `require()` with Node, so extract the version line by key.
          # `"version"` appears once at the top level of tauri.conf.json; tooling
          # adds no second one. package.json is plain JSON → safe to require().
          V_CONF=$(grep -m1 -E '"version"' client/src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          V_CARGO=$(grep -m1 -E '^version' client/src-tauri/Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          V_NPM=$(node -p "require('./client/package.json').version")
          V_LINUX_CONF=$(grep -m1 -E '"version"' linux/src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          V_LINUX_CARGO=$(grep -m1 -E '^version' linux/src-tauri/Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          V_LINUX_NPM=$(node -p "require('./linux/package.json').version")
          echo "tauri.conf.json = $V_CONF"
          echo "Cargo.toml     = $V_CARGO"
          echo "package.json    = $V_NPM"
          echo "linux tauri.conf.json = $V_LINUX_CONF"
          echo "linux Cargo.toml       = $V_LINUX_CARGO"
          echo "linux package.json     = $V_LINUX_NPM"
          if [ "$V_CONF" != "$V_CARGO" ] || [ "$V_CONF" != "$V_NPM" ] || \
             [ "$V_CONF" != "$V_LINUX_CONF" ] || [ "$V_CONF" != "$V_LINUX_CARGO" ] || \
             [ "$V_CONF" != "$V_LINUX_NPM" ]; then
            echo "::error::Version mismatch across Windows/Linux manifests — bump every version source before tagging."
            exit 1
          fi
          echo "Version consistent: $V_CONF"

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build Windows NSIS bundle
        working-directory: client
        env:
          # Private key + password for signing the .exe (Fase 2). The installer
          # is signature-validated against the pubkey embedded in tauri.conf.json
          # before the client ever installs it. These are GitHub repo secrets the
          # owner adds manually (see repo README / release steps) — never committed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Production relay URL, baked into the frontend at build time (Vite
          # statically substitutes VITE_* keys — see client/src/lib/types.ts
          # DEFAULT_RELAY_URL). Without this, a CI build falls back to
          # `ws://localhost:8787` and ships an app that can't reach its relay.
          # This is a deploy fact (the Worker URL), NOT a secret — the Workers
          # endpoint is public and forwards only opaque ciphertext — so it is fine
          # to hardcode it here. Bump this only if the Worker is redeployed under
          # a new name.
          VITE_RELAY_URL: wss://harbor-cloud.josuelima10459510.workers.dev
        run: npm run tauri build -- --bundles nsis

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --title "Harbor $env:RELEASE_TAG" --generate-notes
          }

      - name: Upload Windows artifacts and updater manifest
        shell: pwsh
        working-directory: client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundle = Join-Path $PWD "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "NSIS setup.exe not found in $bundle" }
          $signature = Get-Item "$($setup.FullName).sig"
          if (-not (Test-Path $signature.FullName)) { throw "NSIS signature not found" }

          gh release upload "$env:RELEASE_TAG" $setup.FullName $signature.FullName --clobber

          $version = (Get-Content package.json | ConvertFrom-Json).version
          $signatureText = (Get-Content $signature.FullName -Raw).Trim()
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$($setup.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $signatureText; url = $assetUrl }
              "windows-x86_64-nsis" = [ordered]@{ signature = $signatureText; url = $assetUrl }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content latest.json
          gh release upload "$env:RELEASE_TAG" "$PWD/latest.json" --clobber

  build-linux-and-extend-manifest:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Linux client dependencies
        working-directory: linux
        run: npm ci

      - name: Build and sign Linux AppImage
        working-directory: linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_RELAY_URL: wss://harbor-cloud.josuelima10459510.workers.dev
        run: |
          npm exec tauri build -- --bundles appimage

      - name: Upload Linux assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: linux
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          test -n "$APPIMAGE"
          test -s "$APPIMAGE.sig"
          gh release upload "$RELEASE_TAG" "$APPIMAGE" "$APPIMAGE.sig" --clobber

      - name: Add Linux platform to updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: linux
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE_NAME="Harbor_${VERSION}_amd64.AppImage"
          APPIMAGE_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/${APPIMAGE_NAME}"
          curl --fail --silent --show-error --location \
            "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/latest.json" \
            -o latest.json
          APPIMAGE_SIG=$(cat "src-tauri/target/release/bundle/appimage/${APPIMAGE_NAME}.sig")
          jq --arg url "$APPIMAGE_URL" --arg sig "$APPIMAGE_SIG" \
            '.platforms["linux-x86_64"] = {"signature": $sig, "url": $url}' \
            latest.json > latest.json.tmp
          mv latest.json.tmp latest.json
          jq -e '.platforms["linux-x86_64"].url and .platforms["linux-x86_64"].signature' latest.json >/dev/null
          gh release upload "$RELEASE_TAG" latest.json --clobber
