[workspace]
members = [
    "protocol",
    "control",
    "core/harbor-core",
    "server/harbor-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
crc32fast = "1.5"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
md5 = "0.8"
sha1 = "0.10"
libc = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3.36", default-features = false, features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets", "zeroize"] }
