[package]
name = "harbor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The desktop binary links the rlib; the Android build links the cdylib
# through JNI (Android cannot spawn the core as a child process).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
libc.workspace = true
harbor-control = { path = "../../control" }
harbor-protocol = { path = "../../protocol" }
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
harbor-server = { path = "../../server/harbor-server" }
